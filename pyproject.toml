[project]
name = "coworking"
version = "0.1.0"
description = "База данных «коворкинг»: схема, наполнение тестовыми данными и запросы"
authors = [
    { name = "Your Name", email = "you@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg2-binary>=2.9",
    "Faker>=30",
    "tabulate>=0.10",
]


[project.scripts]
fill_coworking = "coworking.cli.fill:main"
clear_coworking = "coworking.cli.reset_db:main"
view_tables_coworking = "coworking.cli.view_tables:main"


[tool.poetry]
packages = [
    { include = "coworking", from = "src" },
]


[tool.poetry.group.dev.dependencies]
pytest = ">=8"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
